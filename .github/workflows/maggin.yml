name: Unleashed App AIO Build

on:
  push:
    branches: [ 'master', 'rc', 'testowy' ]
  workflow_dispatch:

# 1. NAPRAWA BŁĘDU 403: Pełne uprawnienia do zapisu tagów i workflow
permissions:
  contents: write
  workflows: write
  packages: write

env:
  # 2. NAPRAWA OSTRZEŻEŃ: Wymuszenie Node 24 (standard 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_number:
    name: Generate build number
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Android & WearOS
    needs: [ build_number ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Budujemy naraz GMS, NoGMS oraz WearOS dla oszczędności czasu
        target: [ "gh_gms", "gh_nogms", "wearos" ]
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build with Gradle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ORG_GRADLE_PROJECT_version_code: ${{ needs.build_number.outputs.number }}
          ORG_GRADLE_PROJECT_version_name: "1.0.${{ needs.build_number.outputs.number }}"
        run: |
          # 3. NAPRAWA BŁĘDU 401: Flagi wyłączające Sentry jeśli brak tokenu
          GRADLE_ARGS="-P@sentry.uploadMappings=false -Psentry.autoUpload=false"
          
          if [ "${{ matrix.target }}" == "wearos" ]; then
            ./gradlew :instances:wearable:assembleRelease $GRADLE_ARGS
          else
            ./gradlew :instances:android:app:assembleRelease $GRADLE_ARGS
          fi

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          # Dynamiczna ścieżka w zależności od modułu
          releaseDirectory: ${{ matrix.target == 'wearos' && 'instances/wearable' || 'instances/android/app' }}/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_ALIAS_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unleashed-${{ matrix.target }}
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}

  publish:
    name: Create GitHub Release
    needs: [ build_number, build ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/testowy'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*.apk
          tag_name: v${{ needs.build_number.outputs.number }}-${{ github.ref_name }}
          name: "Unleashed Build ${{ needs.build_number.outputs.number }} (${{ github.ref_name }})"
          body: "Automatyczny build gałęzi ${{ github.ref_name }}. Sentry: Wyłączone (brak tokenu)."
          prerelease: ${{ github.ref != 'refs/heads/master' }}
          
