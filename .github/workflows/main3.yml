name: Build and publish Release

on:
  push:
    branches: [ 'master', 'rc', 'testowy' ]
  workflow_dispatch:

# Wymagane dla zapisu tagów (numeru buildu) i Release
permissions:
  contents: write
  packages: write

# Wymuszenie Node 24 dla wszystkich akcji (standard na czerwiec 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate_gradle_wrapper:
    name: "Validate gradle wrapper"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        # Nowsza wersja zintegrowana z setup-gradle, aby uniknąć ostrzeżeń o deprecjacji
        uses: gradle/actions/wrapper-validation@v4 

  build_number:
    name: Generate build number
    runs-on: ubuntu-latest
    needs: [ validate_gradle_wrapper ]
    outputs:
      number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [ build_number ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_version_code: ${{ needs.build_number.outputs.number }}
          # Tu możesz dodać swoje sekrety jeśli budujesz wersję podpisaną
        run: |
          chmod +x gradlew
          ./gradlew :instances:android:app:assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unleashed-release-${{ needs.build_number.outputs.number }}
          path: instances/android/app/build/outputs/apk/release/*.apk

  upload_to_github:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build_release, build_number ]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/testowy'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unleashed-release-${{ needs.build_number.outputs.number }}
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          tag_name: v${{ needs.build_number.outputs.number }}
          name: "Unleashed Build ${{ needs.build_number.outputs.number }}"
          body: "Automatyczny build z gałęzi ${{ github.ref_name }}"
          
