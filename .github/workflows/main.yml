name: Build APK z gałęzi testowy

on:
  push:
    branches:
      - testowy
  pull_request:
    branches:
      - testowy
  workflow_dispatch: # Pozwala na ręczne uruchomienie z panelu Actions

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: testowy # Wymusza pobranie gałęzi testowy

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Znacznie przyspiesza kolejne kompilacje

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Debug)
        # Buduje testową/debugową wersję aplikacji
        run: ./gradlew assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unleashed-app-testowy
          # Moduł główny w tym repozytorium to "instances/app"
          path: instances/app/build/outputs/apk/**/*.apk
          retention-days: 30 # Czas przechowywania artefaktu
          
