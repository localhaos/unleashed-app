name: Build and publish Release

on:
  push:
    branches: [ 'master', 'rc', 'testowy' ]
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Zwiększenie limitu pamięci dla JVM, aby uniknąć wywalenia buildu na darmowym runnerze
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"

jobs:
  build_number:
    name: Generate build number
    runs-on: ubuntu-latest
    outputs:
      number: ${{ github.run_number }}
    steps:
      - run: echo "Build number is ${{ github.run_number }}"

  build_release:
    name: Build Release (gh_gms)
    runs-on: ubuntu-latest
    needs: [ build_number ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build with Gradle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ORG_GRADLE_PROJECT_version_code: ${{ needs.build_number.outputs.number }}
          ORG_GRADLE_PROJECT_version_name: "1.0.${{ needs.build_number.outputs.number }}"
        run: |
          # 1. Wczytujemy zmienne środowiskowe celu
          export $(cat .github/workflows/targets/gh_gms.env | xargs)
          
          # 2. Wykonujemy build z flagami bezpieczeństwa
          ./gradlew :instances:android:app:assembleRelease \
            -P@sentry.uploadMappings=false \
            -Psentry.autoUpload=false \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unleashed-gms-build-${{ needs.build_number.outputs.number }}
          path: instances/android/app/build/outputs/apk/release/*.apk

  # Job do tworzenia Release na GitHub (tylko dla master i testowy)
  create_release:
    needs: [ build_release, build_number ]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/testowy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unleashed-gms-build-${{ needs.build_number.outputs.number }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          tag_name: v${{ needs.build_number.outputs.number }}
          name: "Unleashed Build ${{ needs.build_number.outputs.number }}"
          prerelease: ${{ github.ref != 'refs/heads/master' }}
          
